# RabbitMQ TLS configuration (production)
# Encrypted AMQP only — the plaintext listener is disabled so nothing can
# connect without TLS. The server cert is signed by the shared PostgreSQL CA.

# Disable the plaintext AMQP listener (5672); accept TLS only.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
ssl_options.certfile   = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile    = /etc/rabbitmq/certs/server.key

# Clients authenticate with username/password over the encrypted channel; we do
# not require client certificates, so peer verification is disabled server-side.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
