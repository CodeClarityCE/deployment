# RabbitMQ TLS configuration (production)
# Encrypted AMQP only — the plaintext listener is disabled so nothing can
# connect without TLS. The server cert is signed by the shared PostgreSQL CA.

# Disable the plaintext AMQP listener (5672); accept TLS only.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /run/codeclarity/ca.crt
ssl_options.certfile   = /run/codeclarity/server.crt
ssl_options.keyfile    = /run/codeclarity/server.key

# Clients authenticate with username/password over the encrypted channel; we do
# not require client certificates, so peer verification is disabled server-side.
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# Definitions imported additively at boot from every .json in this directory:
# the vhost and user written by generate-secrets, and the dead-letter topology
# + policy from rabbitmq-definitions.json. A poison message
# dropped by a service consumer (basic.nack with requeue=false) is routed to the
# dead-letter exchange and retained in dead-letter-queue rather than silently
# discarded. Applied as a policy so it attaches to already-declared queues
# without the PRECONDITION_FAILED that changing queue x-arguments would cause.
definitions.import_backend = local_filesystem
definitions.local.path = /run/codeclarity/definitions

# The memory RabbitMQ counts on is its container limit (512 MiB in docker-compose.yaml; keep them equal).
# Publishers are blocked at 60% of it, before the container runs out of memory.
total_memory_available_override_value = 536870912
vm_memory_high_watermark.relative = 0.6
