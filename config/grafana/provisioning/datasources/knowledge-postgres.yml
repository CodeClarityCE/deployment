apiVersion: 1

datasources:
  - name: Knowledge Postgres
    type: grafana-postgresql-datasource
    uid: knowledge-postgres
    access: proxy
    url: db:5432
    user: cc_exporter
    editable: false
    jsonData:
      database: knowledge
      sslmode: verify-ca
      tlsConfigurationMethod: file-path
      sslRootCertFile: /var/lib/postgresql/certs/ca.crt
      postgresVersion: 1800
      maxOpenConns: 2
    secureJsonData:
      password: $CC_EXPORTER_PASSWORD
