; Production pgbouncer config (transaction pooling) for CodeClarity.
; Mounted into the edoburu/pgbouncer container at /etc/pgbouncer/pgbouncer.ini.
;
; No fixed "user=" on the databases line: with auth_query + SCRAM pass-through,
; pgbouncer connects upstream as the client's own authenticated role
; (cc_api, cc_service, cc_plugin, cc_knowledge), preserving least-privilege.

[databases]
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; --- Authentication (multi-role via auth_query) ---
auth_type = scram-sha-256
auth_user = pgbouncer_auth
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT username, password FROM public.pgbouncer_get_auth($1)

; --- Pooling ---
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
; Connection budget: default_pool_size(20) × (roles × databases) stays well under
; the server's max_connections=200. Replica count no longer drives server connections.

ignore_startup_parameters = extra_float_digits
admin_users = postgres

; --- TLS: clients verify this cert; SAN must include "pgbouncer" (see generate-pg-certs.sh) ---
client_tls_sslmode = require
client_tls_cert_file = /var/lib/postgresql/certs/server.crt
client_tls_key_file = /var/lib/postgresql/certs/server.key
client_tls_ca_file = /var/lib/postgresql/certs/ca.crt

; --- TLS: upstream connection to Postgres (verify-ca, matches postgresql.conf) ---
server_tls_sslmode = verify-ca
server_tls_ca_file = /var/lib/postgresql/certs/ca.crt
