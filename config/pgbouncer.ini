; Production pgbouncer config (transaction pooling) for CodeClarity.
; Mounted into the edoburu/pgbouncer container at /etc/pgbouncer/pgbouncer.ini.
;
; No fixed "user=" on the databases line: with auth_query + SCRAM pass-through,
; pgbouncer connects upstream as the client's own authenticated role
; (cc_api, cc_service, cc_plugin, cc_knowledge), preserving least-privilege.

[databases]
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; --- Authentication (multi-role via auth_query) ---
auth_type = scram-sha-256
auth_user = pgbouncer_auth
auth_file = /run/codeclarity/userlist.txt
auth_query = SELECT username, password FROM public.pgbouncer_get_auth($1)

; --- Pooling ---
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
; At most 20 server connections per database (4 databases: 80), under Postgres's
; max_connections (PG_MAX_CONNECTIONS, default 100). Clients beyond that wait for a free one.
max_db_connections = 20

ignore_startup_parameters = extra_float_digits
admin_users = postgres

; --- TLS: clients verify this cert; SAN must include "pgbouncer" (made by the generate-secrets job) ---
client_tls_sslmode = require
client_tls_cert_file = /run/codeclarity/server.crt
client_tls_key_file = /run/codeclarity/server.key
client_tls_ca_file = /run/codeclarity/ca.crt

; --- TLS: upstream connection to Postgres (verify-ca, matches postgresql.conf) ---
server_tls_sslmode = verify-ca
server_tls_ca_file = /run/codeclarity/ca.crt
