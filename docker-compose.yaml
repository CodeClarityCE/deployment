# CodeClarity production stack. Install and upgrade are both `docker compose up -d`:
# setup runs as one-shot jobs (secrets, database init, knowledge restore, migrate,
# default analyzer), each doing nothing when its work is already done.
# Settings come from .env (see .env.example); everything else has a default here.
# Needs Docker Compose 2.24 or later.
name: codeclarity

# The deployment release this file is from, set when it is released (empty when unreleased).
# The version-check job refuses to start the stack unless .env's CODECLARITY_VERSION matches it.
x-release-version: &release-version ""

x-postgres-image: &postgres-image postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
x-rabbitmq-image: &rabbitmq-image rabbitmq:4.3.6-management-alpine@sha256:1aab4d911053f3ee4ff9bb231f5192ebd6a12281f8044910256a667fdb04108d

# Loads the generated secrets mounted at /run/codeclarity into the environment, then runs the command.
x-with-secrets: &with-secrets
  - /bin/sh
  - -c
  - set -a && . /run/codeclarity/env && set +a && exec "$$@"
  - with-secrets

# Connection settings every Go service and plugin shares; each reads its role password from its secrets.
x-backend-env: &backend-env
  PG_DB_HOST: pgbouncer
  PG_DB_PORT: "6432"
  PG_DB_NAME: codeclarity
  PG_DB_SSLMODE: verify-ca
  PG_DB_SSLROOTCERT: /run/codeclarity/ca.crt
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-15}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-3}
  DB_CONN_MAX_LIFETIME_SECONDS: ${DB_CONN_MAX_LIFETIME_SECONDS:-300}
  DB_CONN_MAX_IDLE_SECONDS: ${DB_CONN_MAX_IDLE_SECONDS:-60}
  AMQP_ANALYSES_QUEUE: api_request
  AMQP_PROTOCOL: amqps
  AMQP_HOST: rabbitmq
  AMQP_PORT: "5671"
  AMQP_USER: codeclarity
  AMQP_SSLMODE: verify-ca
  AMQP_SSLROOTCERT: /run/codeclarity/ca.crt

# Settings of the Go services (not the plugins).
x-service-env: &service-env
  <<: *backend-env
  PG_DB_USER: cc_service
  DOWNLOAD_PATH: /private
  NPM_URL: https://registry.npmjs.org/
  NVD_API_KEY: ${NVD_API_KEY:-}
  VULNERABILITY_LOOKUP_API_KEY: ${VULNERABILITY_LOOKUP_API_KEY:-}

x-plugin-env: &plugin-env
  <<: *backend-env
  PG_DB_USER: cc_plugin

# The API image's settings. Its secrets come from env/.env.prod, which the API loads itself.
x-api-env: &api-env
  ENV: prod
  PORT: "3000"
  PLATFORM_NAME: CodeClarity
  # Public URLs carry HTTPS_PORT when it is set, so links and OAuth callbacks reach the published port.
  WEB_HOST: https://${DOMAIN:-localhost}${HTTPS_PORT:+:${HTTPS_PORT}}
  HOST: https://${DOMAIN:-localhost}${HTTPS_PORT:+:${HTTPS_PORT}}/api
  DOWNLOAD_PATH: /home/codeclarity/private
  REQUIRE_ACCOUNT_VERIFICATION: "true"
  GITHUB_AUTH_CLIENT_ID: ${GITHUB_AUTH_CLIENT_ID:-}
  GITHUB_AUTH_CLIENT_SECRET: ${GITHUB_AUTH_CLIENT_SECRET:-}
  GITHUB_CALLBACK: https://${DOMAIN:-localhost}${HTTPS_PORT:+:${HTTPS_PORT}}/api/auth/github/callback
  GITHUB_AUTH_CALLBACK: https://${DOMAIN:-localhost}${HTTPS_PORT:+:${HTTPS_PORT}}/auth/github/callback
  GITLAB_AUTH_CLIENT_ID: ${GITLAB_AUTH_CLIENT_ID:-}
  GITLAB_AUTH_CLIENT_SECRET: ${GITLAB_AUTH_CLIENT_SECRET:-}
  GITLAB_AUTH_HOST: ${GITLAB_AUTH_HOST:-https://gitlab.com}
  GITLAB_CALLBACK: https://${DOMAIN:-localhost}${HTTPS_PORT:+:${HTTPS_PORT}}/api/auth/gitlab/callback
  GITLAB_AUTH_CALLBACK: https://${DOMAIN:-localhost}${HTTPS_PORT:+:${HTTPS_PORT}}/auth/gitlab/callback
  CLICKUP_CLIENT_ID: ${CLICKUP_CLIENT_ID:-}
  CLICKUP_CLIENT_SECRET: ${CLICKUP_CLIENT_SECRET:-}
  MAIL_HOST: ${MAIL_HOST:-localhost}
  MAIL_PORT: ${MAIL_PORT:-465}
  MAIL_AUTH_USER: ${MAIL_AUTH_USER:-noreply@localhost}
  MAIL_AUTH_PASSWORD: ${MAIL_AUTH_PASSWORD:-}
  MAIL_DEFAULT_FROM: ${MAIL_DEFAULT_FROM:-noreply@localhost}
  PG_DB_USER: cc_api
  PG_DB_HOST: pgbouncer
  PG_DB_PORT: "6432"
  PG_DB_NAME: codeclarity
  PG_DB_SSLMODE: verify-ca
  PG_DB_SSLROOTCERT: /home/codeclarity/app/env/ca.crt
  PG_DB_POOL_MAX: ${PG_DB_POOL_MAX:-10}
  AMQP_ANALYSES_QUEUE: api_request
  AMQP_PROTOCOL: amqps
  AMQP_HOST: rabbitmq
  AMQP_PORT: "5671"
  AMQP_USER: codeclarity
  AMQP_SSLMODE: verify-ca
  AMQP_SSLROOTCERT: /home/codeclarity/app/env/ca.crt

# What every Go service and plugin waits for.
x-backend-depends: &backend-depends
  migrate:
    condition: service_completed_successfully
  rabbitmq:
    condition: service_healthy
  pgbouncer:
    condition: service_started

services:
  # One-shot job: fails when .env's CODECLARITY_VERSION is not this file's release, so a Compose
  # file and an .env from different releases never start together. Everything waits on it.
  version-check:
    image: *rabbitmq-image
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        if [ -n "$$RELEASE" ] && [ "$$RELEASE" != "$$CODECLARITY_VERSION" ]; then
          echo "This Compose file is release $$RELEASE, but .env sets CODECLARITY_VERSION=$$CODECLARITY_VERSION." >&2
          echo "Set CODECLARITY_VERSION=$$RELEASE in .env, or use the Compose file of the release you meant." >&2
          exit 1
        fi
    environment:
      RELEASE: *release-version
      CODECLARITY_VERSION: ${CODECLARITY_VERSION:-}

  # One-shot job: generates any missing secret into the secrets volume and gives each
  # service a volume with only what it reads.
  generate-secrets:
    image: *rabbitmq-image
    restart: "no"
    entrypoint: ["sh", "/usr/local/bin/generate-secrets.sh", "/secrets"]
    configs:
      - source: generate-secrets
        target: /usr/local/bin/generate-secrets.sh
      - source: rabbitmq-definitions
        target: /etc/codeclarity/rabbitmq-definitions.json
    volumes:
      - secrets:/secrets
      - secrets-db:/secrets/db
      - secrets-pgbouncer:/secrets/pgbouncer
      - secrets-rabbitmq:/secrets/rabbitmq
      - secrets-knowledge-restore:/secrets/knowledge-restore
      - secrets-migrate:/secrets/migrate
      - secrets-api:/secrets/api
      - secrets-api-jwt:/secrets/api-jwt
      - secrets-service:/secrets/service
      - secrets-plugin:/secrets/plugin
      - secrets-knowledge:/secrets/knowledge
      - secrets-grafana:/secrets/grafana
      - secrets-exporter:/secrets/exporter
    depends_on:
      version-check:
        condition: service_completed_successfully

  rabbitmq:
    restart: always
    image: *rabbitmq-image
    hostname: "codeclarity"
    environment:
      - RABBITMQ_ENABLED_PLUGINS_FILE=/etc/rabbitmq/enabled_plugins
    command:
      - bash
      - -c
      - |
        rabbitmq-plugins enable rabbitmq_management rabbitmq_prometheus --offline &&
        exec docker-entrypoint.sh rabbitmq-server
    configs:
      - source: rabbitmq-conf
        target: /etc/rabbitmq/rabbitmq.conf
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
      - secrets-rabbitmq:/run/codeclarity:ro
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 500M

  # Its init script creates the databases and roles on an empty data volume.
  db:
    image: *postgres-image
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # Connection budget: pgbouncer opens at most max_db_connections(20) × 4 databases = 80
    # server connections, whatever the replica count; the rest of max_connections is for the
    # direct ones (migrate, default-analyzer, knowledge-restore, postgres_exporter, superuser).
    entrypoint: *with-secrets
    # Sized for the 8 GB reference machine; each PG_* setting in .env overrides its value.
    command:
      - docker-entrypoint.sh
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
    configs:
      - source: initdb
        target: /docker-entrypoint-initdb.d/02-create-databases-and-roles.sh
      - source: postgresql-conf
        target: /etc/postgresql/postgresql.conf
      - source: pg-hba
        target: /etc/postgresql/pg_hba.conf
    volumes:
      - db_data_container:/var/lib/postgresql/18
      - secrets-db:/run/codeclarity:ro
    environment:
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    depends_on:
      generate-secrets:
        condition: service_completed_successfully
    # Checks over TCP, which the first-run init server does not listen on, so the
    # setup jobs only start once the init script has created the databases and roles.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Transaction-pooling connection pooler. Application services connect here
  # instead of directly to Postgres. Config and multi-role auth_query: config/pgbouncer.ini.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    restart: always
    depends_on:
      db:
        condition: service_healthy
    configs:
      - source: pgbouncer-ini
        target: /etc/pgbouncer/pgbouncer.ini
    volumes:
      - secrets-pgbouncer:/run/codeclarity:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # One-shot job: restores knowledge and config from the dump image when knowledge is empty.
  # KNOWLEDGE_DUMP_IMAGE swaps in another dump image.
  knowledge-restore:
    image: ${KNOWLEDGE_DUMP_IMAGE:-codeclarityce/knowledge-dump:2026-11-16}
    restart: "no"
    entrypoint: *with-secrets
    command: ["sh", "/usr/local/bin/restore-dump.sh", "restore-if-empty"]
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGSSLMODE=verify-ca
      - PGSSLROOTCERT=/run/codeclarity/ca.crt
    volumes:
      - secrets-knowledge-restore:/run/codeclarity:ro
    depends_on:
      db:
        condition: service_healthy

  # One-shot job: applies pending migrations straight on Postgres (not pgbouncer).
  # The API and every service wait for it.
  migrate:
    image: codeclarityce/api
    command: ["node", "dist/scripts/migrate.js"]
    restart: "no"
    environment:
      <<: *api-env
      PG_DB_HOST: db
      PG_DB_PORT: "5432"
      PG_DB_ADMIN_USER: postgres
    volumes:
      - secrets-migrate:/home/codeclarity/app/env:ro
    depends_on:
      db:
        condition: service_healthy
      knowledge-restore:
        condition: service_completed_successfully

  # One-shot job: creates the global default analyzer unless a global analyzer
  # of that name exists, then exits. Connects as the API's role, straight on Postgres.
  default-analyzer:
    image: codeclarityce/api
    command: ["node", "dist/scripts/create-default-analyzer.js"]
    restart: "no"
    environment:
      <<: *api-env
      PG_DB_HOST: db
      PG_DB_PORT: "5432"
    volumes:
      - secrets-api:/home/codeclarity/app/env:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Also runs `create-user`: docker compose run --rm api create-user --email ... --name ...
  # (password from --password or CREATE_USER_PASSWORD).
  api:
    image: codeclarityce/api
    restart: always
    environment:
      <<: *api-env
      CREATE_USER_EMAIL: ${CREATE_USER_EMAIL:-}
      CREATE_USER_NAME: ${CREATE_USER_NAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      default-analyzer:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    volumes:
      - secrets-api:/home/codeclarity/app/env:ro
      - secrets-api-jwt:/home/codeclarity/app/jwt:ro
      - projects:/home/codeclarity/private
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 500M

  frontend:
    image: codeclarityce/frontend
    restart: always
    # TLS follows DOMAIN: Caddy's internal CA for localhost, ACME for a public name, or the
    # operator's certificate when TLS_CERT and TLS_KEY are set in .env.
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_TLS: ${TLS_CERT:+tls /etc/caddy/tls/cert.pem /etc/caddy/tls/key.pem}
      CADDY_ACME_CA: ${ACME_CA:+acme_ca ${ACME_CA:-}}
      # ":<port>" when HTTPS is published on a port other than 443, for the HTTP redirect.
      CADDY_HTTPS_PORT: ${HTTPS_PORT:+:${HTTPS_PORT}}
    # The public certificate as a label, so a renewed one recreates the container.
    labels:
      io.codeclarity.tls-cert: ${TLS_CERT:-}
    ports:
      # HTTP
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      # HTTPS
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      # HTTP/3
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
      # API
      - target: 3000
        published: 3000
        protocol: tcp
      # API
      - target: 3001
        published: 3001
        protocol: tcp
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
      - source: tls-cert
        target: /etc/caddy/tls/cert.pem
      - source: tls-key
        target: /etc/caddy/tls/key.pem
        mode: 0400
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 500M

  service-dispatcher:
    image: codeclarityce/service-dispatcher
    restart: always
    entrypoint: *with-secrets
    command: ["./plugin"]
    environment: *service-env
    depends_on: *backend-depends
    volumes:
      - secrets-service:/run/codeclarity:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 500M

  service-downloader:
    image: codeclarityce/service-downloader
    restart: always
    entrypoint: *with-secrets
    command: ["./plugin"]
    environment: *service-env
    depends_on: *backend-depends
    volumes:
      - projects:/private
      - secrets-service:/run/codeclarity:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 500M

  service-follower:
    image: codeclarityce/service-package-follower
    restart: always
    entrypoint: *with-secrets
    command: ["./plugin"]
    environment: *service-env
    depends_on: *backend-depends
    volumes:
      - projects:/private
      - secrets-service:/run/codeclarity:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 500M

  service-scheduler:
    image: codeclarityce/service-scheduler
    restart: always
    entrypoint: *with-secrets
    command: ["./scheduler"]
    environment: *service-env
    depends_on: *backend-depends
    volumes:
      - secrets-service:/run/codeclarity:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M
        reservations:
          cpus: "0.25"
          memory: 250M

  service-notifier:
    image: codeclarityce/service-notifier
    restart: always
    entrypoint: *with-secrets
    command: ["./plugin"]
    environment: *service-env
    depends_on: *backend-depends
    volumes:
      - secrets-service:/run/codeclarity:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M
        reservations:
          cpus: "0.25"
          memory: 250M

  # Keeps the knowledge database current. Runs without an NVD key, at NVD's lower rate.
  # Low CPU weight and a fixed memory share, so updates never slow analyses or the UI.
  service-knowledge:
    image: codeclarityce/service-knowledge
    restart: always
    entrypoint: *with-secrets
    command: ["./plugin", "-daemon"]
    environment:
      <<: *service-env
      PG_DB_USER: cc_knowledge
      # Keep the Go heap below the container's memory limit.
      GOMEMLIMIT: 640MiB
    depends_on: *backend-depends
    volumes:
      - secrets-knowledge:/run/codeclarity:ro
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  plugin-js-sbom:
    image: codeclarityce/plugin-js-sbom
    restart: always
    entrypoint: *with-secrets
    command: ["./plugin"]
    environment: *plugin-env
    depends_on: *backend-depends
    volumes:
      - projects:/private
      - secrets-plugin:/run/codeclarity:ro
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 500M
        reservations:
          cpus: "0.5"
          memory: 250M

  plugin-license-finder:
    image: codeclarityce/plugin-license-finder
    restart: always
    entrypoint: *with-secrets
    command: ["./plugin"]
    environment: *plugin-env
    depends_on: *backend-depends
    volumes:
      - secrets-plugin:/run/codeclarity:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 500M
        reservations:
          cpus: "0.5"
          memory: 250M

  plugin-vuln-finder:
    image: codeclarityce/plugin-vuln-finder
    restart: always
    entrypoint: *with-secrets
    command: ["./plugin"]
    environment: *plugin-env
    depends_on: *backend-depends
    volumes:
      - projects:/private
      - secrets-plugin:/run/codeclarity:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G

  plugin-php-sbom:
    image: codeclarityce/plugin-php-sbom
    restart: always
    entrypoint: *with-secrets
    command: ["./plugin"]
    environment: *plugin-env
    depends_on: *backend-depends
    volumes:
      - projects:/private
      - secrets-plugin:/run/codeclarity:ro
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 500M
        reservations:
          cpus: "0.5"
          memory: 250M

  plugin-codeql:
    image: codeclarityce/plugin-codeql
    platform: linux/amd64 # CodeQL works only on x86 platforms
    restart: always
    entrypoint: *with-secrets
    command: ["./plugin"]
    environment: *plugin-env
    depends_on: *backend-depends
    volumes:
      - projects:/private
      - secrets-plugin:/run/codeclarity:ro
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G

  # Monitoring (prometheus, grafana, postgres_exporter) runs only with the monitoring profile.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: codeclarity-prometheus
    restart: always
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.external-url=http://localhost:9091"
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: codeclarity-grafana
    restart: always
    configs:
      - source: grafana-datasource-prometheus
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana-datasource-knowledge
        target: /etc/grafana/provisioning/datasources/knowledge-postgres.yml
      - source: grafana-dashboards
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
      - source: grafana-alerting
        target: /etc/grafana/provisioning/alerting/knowledge-sources.yml
      - source: grafana-dashboard-codeclarity
        target: /var/lib/grafana/dashboards/codeclarity-improved.json
      - source: grafana-dashboard-infrastructure
        target: /var/lib/grafana/dashboards/infrastructure-monitoring.json
      - source: grafana-dashboard-rabbitmq
        target: /var/lib/grafana/dashboards/rabbitmq-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - secrets-grafana:/run/codeclarity:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/codeclarity/admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      prometheus:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  postgres_exporter:
    profiles: [monitoring]
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: codeclarity-postgres-exporter
    restart: always
    environment:
      - DATA_SOURCE_URI=db:5432/codeclarity?sslmode=verify-ca&sslrootcert=/run/codeclarity/ca.crt
      - DATA_SOURCE_USER=cc_exporter
      - DATA_SOURCE_PASS_FILE=/run/codeclarity/cc_exporter_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - secrets-exporter:/run/codeclarity:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

# Files shipped with this Compose file, mounted read-only; none is edited by the operator.
configs:
  generate-secrets:
    file: ./scripts/generate-secrets.sh
  initdb:
    file: ./docker-entrypoint-initdb/02-create-databases-and-roles.sh
  postgresql-conf:
    file: ./config/postgresql.conf
  pg-hba:
    file: ./config/pg_hba.conf
  pgbouncer-ini:
    file: ./config/pgbouncer.ini
  rabbitmq-conf:
    file: ./config/rabbitmq.conf
  rabbitmq-definitions:
    file: ./config/rabbitmq-definitions.json
  caddyfile:
    file: ./config/Caddyfile
  # The operator's certificate and key from .env, empty when unset (Caddy then ignores them).
  tls-cert:
    content: |
      ${TLS_CERT:-}
  tls-key:
    content: |
      ${TLS_KEY:-}
  prometheus:
    file: ./config/prometheus.yml
  grafana-datasource-prometheus:
    file: ./config/grafana/provisioning/datasources/prometheus.yml
  grafana-datasource-knowledge:
    file: ./config/grafana/provisioning/datasources/knowledge-postgres.yml
  grafana-dashboards:
    file: ./config/grafana/provisioning/dashboards/dashboard.yml
  grafana-alerting:
    file: ./config/grafana/provisioning/alerting/knowledge-sources.yml
  grafana-dashboard-codeclarity:
    file: ./config/grafana/dashboards/codeclarity-improved.json
  grafana-dashboard-infrastructure:
    file: ./config/grafana/dashboards/infrastructure-monitoring.json
  grafana-dashboard-rabbitmq:
    file: ./config/grafana/dashboards/rabbitmq-overview.json

volumes:
  # Generated secrets: the store, and one volume per service holding only what it reads.
  secrets:
  secrets-db:
  secrets-pgbouncer:
  secrets-rabbitmq:
  secrets-knowledge-restore:
  secrets-migrate:
  secrets-api:
  secrets-api-jwt:
  secrets-service:
  secrets-plugin:
  secrets-knowledge:
  secrets-grafana:
  secrets-exporter:

  rabbitmq_data:

  caddy_data:
  caddy_config:

  db_data_container:

  projects:
  prometheus_data:
  grafana_data:
